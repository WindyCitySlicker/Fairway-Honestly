<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honest Yardage | Real Course Reviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <div class="hero-overlay">
            <nav class="navbar">
                <div class="logo">HONEST YARDAGE</div>
                <ul class="nav-links">
                    <li><a href="#recently-played">Recently Played</a></li>
                    <li><a href="#19th-hole">19th Hole</a></li>
                    <li><a href="#witb">WITB</a></li>
                    <li><a href="#swing-thoughts">Swing Thoughts</a></li>
                </ul>
            </nav>
            <div class="hero-content">
                <h1>Honest Yardage</h1>
                <p>Data-driven reviews from the short grass.</p>
                <div class="scroll-prompt">
                    <span>Explore the Feed</span>
                    <div class="arrow"></div>
                </div>
            </div>
        </div>
    </header>

    <main id="feed-container">
        <div id="swing-thoughts" class="ticker-wrap">
            <div class="ticker">
                <span class="ticker-label">DAILY SWING THOUGHT:</span>
                <span class="ticker-text">"The more I practice, the luckier I get." — Gary Player</span>
            </div>
        </div>

        </main>

    <footer class="site-footer">
        <p>&copy; 2026 Honest Yardage | Country Club Casual</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
