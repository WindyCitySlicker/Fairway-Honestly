<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Honest Yardage</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="mobile-header">
        <div class="logo">HONEST YARDAGE</div>
    </header>

    <main id="main-content">
        <section id="hero-section" class="hero-mobile"></section>

        <div id="dynamic-view">
            <section id="home-view" class="content-view">
                <div class="ticker-card">
                    <span class="label">DAILY SWING THOUGHT</span>
                    <p id="daily-quote">"Loading..."</p>
                    <hr>
                    <span class="label">ON THIS DAY IN GOLF</span>
                    <p id="golf-history">"Loading..."</p>
                    <a id="history-link" href="#" target="_blank" class="btn-mini">Read History &rarr;</a>
                </div>
            </section>

            <div id="feed-container"></div>
        </div>
    </main>

    <nav class="mobile-nav">
        <button class="nav-item active" onclick="app.showPage('home')">Home</button>
        <button class="nav-item" onclick="app.showPage('reviews')">Reviews</button>
        <button class="nav-item" onclick="app.showPage('19th')">19th Hole</button>
        <button class="nav-item" onclick="app.showPage('witb')">WITB</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
