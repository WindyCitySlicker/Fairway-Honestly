<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honest Yardage | The Truth on the Turf</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header class="app-header">
        <h1 class="logo">HONEST YARDAGE</h1>
    </header>

    <main id="app-view">
        <section id="home" class="view active">
            <div class="hero-image" style="background-image: url('images/image.jpeg');"></div>
            <div class="daily-card">
                <span class="badge">SWING THOUGHT</span>
                <p id="quote-display"></p>
                <button class="btn-history" id="history-trigger">On This Day in Golf &rarr;</button>
            </div>
        </section>

        <section id="reviews" class="view">
            <h2>Recently Played</h2>
            <div id="course-feed"></div>
            <button id="load-more" class="btn-secondary">Load More Courses</button>
        </section>

        <section id="clubhouse" class="view">
            <h2>The 19th Hole</h2>
            <div id="beer-ranking"></div>
        </section>
    </main>

    <nav class="bottom-nav" role="tablist">
        <button class="nav-btn active" data-target="home" aria-selected="true">Home</button>
        <button class="nav-btn" data-target="reviews" aria-selected="false">Reviews</button>
        <button class="nav-btn" data-target="clubhouse" aria-selected="false">19th Hole</button>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
